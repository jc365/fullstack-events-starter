services:
  postgres:
    image: postgres:16
    container_name: {{PROJECT_NAME}}-db
    environment:
      POSTGRES_USER: {{PROJECT_NAME}}
      POSTGRES_PASSWORD: {{PROJECT_NAME}}
      POSTGRES_DB: {{PROJECT_NAME}}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{PROJECT_NAME}}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
