services:
  postgres:
    image: postgres:16
    container_name: castant-db
    environment:
      POSTGRES_USER: castant
      POSTGRES_PASSWORD: castant
      POSTGRES_DB: castant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
